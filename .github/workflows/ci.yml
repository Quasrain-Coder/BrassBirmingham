name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 聚合 job：根 package.json 的 typecheck/test 均为 --workspaces --if-present，
  # 任何带对应 scripts 的 packages/* 新包（protocol/server/...）自动纳入，无需改本文件。
  build-test:
    name: build-test (typecheck + test + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
